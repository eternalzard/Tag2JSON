<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Tag2JSON</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 16px;
        box-sizing: border-box;
        overflow: hidden; /* 不出滚动条 */
      }
      .title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .desc {
        color: #666;
        font-size: 12px;
        line-height: 1.5;
        margin-bottom: 12px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        font-size: 12px;
        padding: 8px;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 6px;
        padding: 8px;
        font-size: 12px;
        background: #18a0fb;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: #2c2c2c;
      }
      button.purple {
        background: #7668F9;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      hr {
        border: none;
        border-top: 1px solid #eee;
        margin: 20px 0;
      }
      code {
        background: #f3f3f3;
        padding: 0 4px;
        border-radius: 3px;
      }
      .footer {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        pointer-events: none;
      }
      .footer .tip {
        font-size: 12px;
        line-height: 1.4;
        color: #FF7112;
        margin: 0;
      }
      .footer .version {
        font-size: 12px;
        font-weight: 400;
        color: #CCCCCC;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="title">添加描述</div>
    <div class="desc">输入的内容添加至组件描述第一行，已有描述会放到第二行</div>
    <input id="fieldInput" placeholder="例如：@owner=design-system" />
    <button id="applyBtn" disabled>立即应用</button>

    <hr />

    <div class="title">导出为PNG</div>
    <div class="desc">以组件描述中的ID作为文件名，多张自动打包为ZIP下载</div>
    <button id="exportBtn" class="secondary" disabled>导出为 PNG</button>

    <hr />

    <div class="title">导出为JSON</div>
    <div class="desc">输出映射关系JSON文件，ID取自组件描述中的ID，外链取自组件配置中的Link</div>
    <button id="exportJsonBtn" class="purple" disabled>导出为 JSON</button>

    <div class="footer">
      <div id="selectionTip" class="tip">请先在画布上选中至少一个组件 / 组件集</div>
      <div class="version">v1.3.0</div>
    </div>

    <script>
      const input = document.getElementById('fieldInput');
      const applyBtn = document.getElementById('applyBtn');
      const exportBtn = document.getElementById('exportBtn');
      const exportJsonBtn = document.getElementById('exportJsonBtn');
      const selectionTip = document.getElementById('selectionTip');

      // 选中的有效组件数量（由 code.js 通过 selection-changed 推送）
      let selectionCount = 0;
      // 是否正在导出（导出期间即便选区变化也保持禁用 + 文案）
      let isExporting = false;
      // 当前正在执行的导出类型：'png' | 'json' | null
      let exportingType = null;

      function refreshButtons() {
        const hasSelection = selectionCount > 0;
        applyBtn.disabled = !hasSelection;

        // 导出 PNG 按钮
        if (isExporting && exportingType === 'png') {
          exportBtn.disabled = true;
          exportBtn.textContent = '正在导出...';
        } else {
          exportBtn.disabled = !hasSelection || isExporting;
          exportBtn.textContent = '导出为 PNG';
        }

        // 导出 JSON 按钮
        if (isExporting && exportingType === 'json') {
          exportJsonBtn.disabled = true;
          exportJsonBtn.textContent = '正在导出...';
        } else {
          exportJsonBtn.disabled = !hasSelection || isExporting;
          exportJsonBtn.textContent = '导出为 JSON';
        }

        if (hasSelection) {
          selectionTip.textContent = `已选中 ${selectionCount} 个组件 / 组件集`;
          selectionTip.style.color = '#2b8a3e';
        } else {
          selectionTip.textContent = '请先在画布上选中至少一个组件 / 组件集';
          selectionTip.style.color = '#FF7112';
        }
      }

      // 初始化按钮状态
      refreshButtons();

      applyBtn.onclick = () => {
        if (applyBtn.disabled) return;
        parent.postMessage(
          { pluginMessage: { type: 'apply-field', field: input.value } },
          '*'
        );
      };

      exportBtn.onclick = () => {
        if (exportBtn.disabled) return;
        isExporting = true;
        exportingType = 'png';
        refreshButtons();
        parent.postMessage(
          { pluginMessage: { type: 'export-selection' } },
          '*'
        );
      };

      exportJsonBtn.onclick = () => {
        if (exportJsonBtn.disabled) return;
        isExporting = true;
        exportingType = 'json';
        refreshButtons();
        parent.postMessage(
          { pluginMessage: { type: 'export-json' } },
          '*'
        );
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !applyBtn.disabled) applyBtn.click();
      });

      // ============================================================
      // 极简 ZIP 打包（store 模式，不压缩），无外部依赖
      // 仅实现导出 PNG 所需的最小必要 ZIP 结构
      // ============================================================
      const CRC_TABLE = (() => {
        const table = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++) {
            c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
          }
          table[n] = c >>> 0;
        }
        return table;
      })();

      function crc32(bytes) {
        let crc = 0xFFFFFFFF;
        for (let i = 0; i < bytes.length; i++) {
          crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
        }
        return (crc ^ 0xFFFFFFFF) >>> 0;
      }

      function strToUtf8Bytes(str) {
        return new TextEncoder().encode(str);
      }

      function buildZip(files) {
        // files: [{ name: string, bytes: Uint8Array }]
        const localParts = [];
        const centralParts = [];
        let offset = 0;

        for (const file of files) {
          const nameBytes = strToUtf8Bytes(file.name);
          const data = file.bytes instanceof Uint8Array ? file.bytes : new Uint8Array(file.bytes);
          const crc = crc32(data);
          const size = data.length;

          // Local file header (30 bytes + name)
          const local = new Uint8Array(30 + nameBytes.length);
          const lv = new DataView(local.buffer);
          lv.setUint32(0, 0x04034b50, true);     // signature
          lv.setUint16(4, 20, true);             // version needed
          lv.setUint16(6, 0x0800, true);         // flags: UTF-8 filename
          lv.setUint16(8, 0, true);              // method: store
          lv.setUint16(10, 0, true);             // mod time
          lv.setUint16(12, 0, true);             // mod date
          lv.setUint32(14, crc, true);           // crc-32
          lv.setUint32(18, size, true);          // compressed size
          lv.setUint32(22, size, true);          // uncompressed size
          lv.setUint16(26, nameBytes.length, true);
          lv.setUint16(28, 0, true);             // extra length
          local.set(nameBytes, 30);

          localParts.push(local, data);

          // Central directory header (46 bytes + name)
          const central = new Uint8Array(46 + nameBytes.length);
          const cv = new DataView(central.buffer);
          cv.setUint32(0, 0x02014b50, true);     // signature
          cv.setUint16(4, 20, true);             // version made by
          cv.setUint16(6, 20, true);             // version needed
          cv.setUint16(8, 0x0800, true);         // flags
          cv.setUint16(10, 0, true);             // method
          cv.setUint16(12, 0, true);             // mod time
          cv.setUint16(14, 0, true);             // mod date
          cv.setUint32(16, crc, true);
          cv.setUint32(20, size, true);
          cv.setUint32(24, size, true);
          cv.setUint16(28, nameBytes.length, true);
          cv.setUint16(30, 0, true);             // extra length
          cv.setUint16(32, 0, true);             // comment length
          cv.setUint16(34, 0, true);             // disk number
          cv.setUint16(36, 0, true);             // internal attrs
          cv.setUint32(38, 0, true);             // external attrs
          cv.setUint32(42, offset, true);        // local header offset
          central.set(nameBytes, 46);
          centralParts.push(central);

          offset += local.length + data.length;
        }

        // 拼接 local 部分
        const localTotalLen = localParts.reduce((s, p) => s + p.length, 0);
        const localAll = new Uint8Array(localTotalLen);
        let p = 0;
        for (const part of localParts) { localAll.set(part, p); p += part.length; }

        // 拼接 central 部分
        const centralTotalLen = centralParts.reduce((s, x) => s + x.length, 0);
        const centralAll = new Uint8Array(centralTotalLen);
        p = 0;
        for (const part of centralParts) { centralAll.set(part, p); p += part.length; }

        // End of central directory record (22 bytes)
        const eocd = new Uint8Array(22);
        const ev = new DataView(eocd.buffer);
        ev.setUint32(0, 0x06054b50, true);
        ev.setUint16(4, 0, true);
        ev.setUint16(6, 0, true);
        ev.setUint16(8, files.length, true);
        ev.setUint16(10, files.length, true);
        ev.setUint32(12, centralAll.length, true);
        ev.setUint32(16, localAll.length, true);
        ev.setUint16(20, 0, true);

        const out = new Uint8Array(localAll.length + centralAll.length + eocd.length);
        out.set(localAll, 0);
        out.set(centralAll, localAll.length);
        out.set(eocd, localAll.length + centralAll.length);
        return out;
      }

      function downloadBlob(name, blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function resetExportBtn() {
        isExporting = false;
        exportingType = null;
        refreshButtons();
      }

      window.onmessage = (event) => {
        const msg = event.data && event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === 'selection-changed') {
          selectionCount = typeof msg.count === 'number' ? msg.count : 0;
          refreshButtons();
          return;
        }

        if (msg.type === 'download-files' && Array.isArray(msg.files)) {
          try {
            if (msg.files.length === 1) {
              // 单文件：直接下载 PNG
              const file = msg.files[0];
              const blob = new Blob([file.bytes], { type: 'image/png' });
              downloadBlob(file.name, blob);
            } else if (msg.files.length > 1) {
              // 多文件：打包 ZIP
              const zipBytes = buildZip(msg.files);
              const blob = new Blob([zipBytes], { type: 'application/zip' });
              downloadBlob(`tag2json-export.zip`, blob);
            }
          } catch (err) {
            console.error('打包/下载失败:', err);
          } finally {
            resetExportBtn();
          }
        } else if (msg.type === 'download-json') {
          try {
            const blob = new Blob([msg.content || ''], { type: 'application/json' });
            downloadBlob(msg.fileName || 'tag2json-export.json', blob);
          } catch (err) {
            console.error('JSON 下载失败:', err);
          } finally {
            resetExportBtn();
          }
        } else if (msg.type === 'export-finished') {
          resetExportBtn();
        }
      };
    </script>
  </body>
</html>
