<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>添加 Description 字段</title>
    <style>
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 16px;
      }
      .title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .desc {
        color: #666;
        font-size: 12px;
        line-height: 1.5;
        margin-bottom: 12px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        font-size: 12px;
        padding: 8px;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 6px;
        padding: 8px;
        font-size: 12px;
        background: #18a0fb;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="title">给选中组件 Description 首行添加自定义字段</div>
    <div class="desc">输入内容会被加到 Description 第一行前面。仅处理选中的组件/组件集。</div>
    <input id="fieldInput" placeholder="例如：@owner=design-system" />
    <button id="applyBtn">立即应用</button>

    <script>
      const input = document.getElementById('fieldInput');
      const button = document.getElementById('applyBtn');

      button.onclick = () => {
        parent.postMessage(
          {
            pluginMessage: {
              type: 'apply-field',
              field: input.value
            }
          },
          '*'
        );
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          button.click();
        }
      });
    </script>
  </body>
</html>
